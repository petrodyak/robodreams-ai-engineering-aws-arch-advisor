# HW 2 CI thresholds (spec §8), read by evals/thresholds.py; `make eval-ci` fails below a `_min`
# or above a `_max`. Each value is the baseline run minus a margin of 0.05, rounded down to a step
# of 0.05 (a `_max` is the baseline plus the margin). Never edited to make a run pass (GIT_RULES).
#
# Baseline (17.11): retrieval.json (hybrid_rerank) and claude-haiku-5-5__v2__medium__k5.json.
# On 20 answerable + 4 no-answer items one item is 0.05 / 0.25, so each threshold allows at
# most one more failure than the baseline, and none on the 4 no-answer items.

retrieval_recall_at_5_min: 0.95   # baseline 1.00
abstain_accuracy_min: 0.95        # baseline 1.00: all 4 no-answer items must abstain
false_abstain_rate_max: 0.05      # baseline 0.00: one false abstain in 20 is allowed
source_hit_min: 0.95              # baseline 1.00
faithfulness_min: 0.90            # baseline 0.99 (0.94 rounds down to 0.90)
judge_pass_rate_min: 0.75         # baseline 0.80
