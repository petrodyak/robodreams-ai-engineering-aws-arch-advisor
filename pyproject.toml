[project]
name = "aws-arch-advisor"
version = "0.1.0"
description = "AWS endpoints & quotas extraction, RAG and architecture-review agent (RobotDreams AI Engineering course project)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# import project code as `src.extract...` from the repo root (the same way main.py will)
pythonpath = ["."]
